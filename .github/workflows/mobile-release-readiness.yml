name: Mobile public release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Reject committed client secrets
        run: npm run security:client-secrets

      - name: Verify public-release evidence ledger
        run: npm run mobile:release-readiness
