name: Bootstrap reviewed npm lock

on:
  push:
    branches:
      - feat/mobile-ios-android-secure-foundation
    paths:
      - .github/workflows/bootstrap-package-lock.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-reviewed-npm-lock
  cancel-in-progress: false

jobs:
  import-reviewed-lock:
    if: github.repository == '1127410650/check-your-name-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mobile-ios-android-secure-foundation
          fetch-depth: 1
          persist-credentials: true

      - name: Download the reviewed lock and peer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          base='https://check-your-name-ai-git-feat-mobile-107d98-1127410650s-projects.vercel.app/.well-known/mobile-review'
          mkdir -p .bootstrap-lock

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location "$base/generation-mode.txt" -o .bootstrap-lock/generation-mode.txt \
              && grep -qx 'legacy-peer-deps-for-diagnosis-only' .bootstrap-lock/generation-mode.txt \
              && curl --fail --silent --show-error --location "$base/package-lock.json" -o .bootstrap-lock/package-lock.json \
              && curl --fail --silent --show-error --location "$base/package-lock.json.sha256" -o .bootstrap-lock/package-lock.json.sha256 \
              && curl --fail --silent --show-error --location "$base/npm-peer-resolution-error.txt" -o .bootstrap-lock/npm-peer-resolution-error.txt; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo 'Reviewed preview lock was not available before timeout.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Validate checksum, package graph, and registry sources
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk 'NR == 1 { print $1 }' .bootstrap-lock/package-lock.json.sha256)"
          actual="$(sha256sum .bootstrap-lock/package-lock.json | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"

          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const lockText = readFileSync('.bootstrap-lock/package-lock.json', 'utf8');
          const lock = JSON.parse(lockText);
          const root = lock.packages?.[''];

          if (lock.lockfileVersion !== 3 || !root) {
            throw new Error('Expected npm package-lock v3 with a root package.');
          }

          for (const section of ['dependencies', 'devDependencies']) {
            const expected = packageJson[section] ?? {};
            const actual = root[section] ?? {};
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              throw new Error(`Lock root does not exactly match package.json ${section}.`);
            }
          }

          const required = {
            'node_modules/@capacitor/android': '7.6.8',
            'node_modules/@capacitor/app': '7.1.2',
            'node_modules/@capacitor/cli': '7.6.8',
            'node_modules/@capacitor/core': '7.6.8',
            'node_modules/@capacitor/ios': '7.6.8',
            'node_modules/@capacitor/preferences': '7.0.4',
            'node_modules/capacitor-secure-storage-plugin': '0.13.0',
          };
          for (const [path, version] of Object.entries(required)) {
            if (lock.packages?.[path]?.version !== version) {
              throw new Error(`Unexpected ${path} version.`);
            }
          }

          let registryPackages = 0;
          for (const [path, entry] of Object.entries(lock.packages ?? {})) {
            if (!entry || typeof entry !== 'object') continue;
            const resolved = entry.resolved;
            if (resolved === undefined) continue;
            if (typeof resolved !== 'string' || !resolved.startsWith('https://registry.npmjs.org/')) {
              throw new Error(`Unapproved package source at ${path}: ${String(resolved)}`);
            }
            if (typeof entry.integrity !== 'string' || !entry.integrity.startsWith('sha512-')) {
              throw new Error(`Missing SHA-512 integrity for ${path}.`);
            }
            registryPackages += 1;
          }

          if (registryPackages < 100) {
            throw new Error(`Unexpectedly small registry package graph: ${registryPackages}.`);
          }
          if (/sb_secret_|service_role|BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY/.test(lockText)) {
            throw new Error('Lockfile contains forbidden secret material.');
          }
          NODE

          test -s .bootstrap-lock/npm-peer-resolution-error.txt
          test "$(wc -c < .bootstrap-lock/npm-peer-resolution-error.txt)" -le 100000

      - name: Commit diagnostic lock for dependency repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lovable/audit
          cp .bootstrap-lock/package-lock.json package-lock.json
          cp .bootstrap-lock/npm-peer-resolution-error.txt .lovable/audit/2026-08-07-npm-peer-resolution-error.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .lovable/audit/2026-08-07-npm-peer-resolution-error.txt
          git diff --cached --check
          git commit -m 'Capture npm dependency graph and peer conflict'
          git push origin HEAD:feat/mobile-ios-android-secure-foundation
