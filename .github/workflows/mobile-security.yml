name: Mobile Security

on:
  push:
    branches:
      - feat/mobile-ios-android-foundation
    paths:
      - .github/workflows/mobile-security.yml
      - capacitor.config.ts
      - mobile-shell/**
      - package.json
      - scripts/check-client-secrets.mjs
      - scripts/check-mobile-security.mjs
      - scripts/harden-native-projects.mjs
      - src/integrations/supabase/client.ts
      - src/lib/mobile-security.ts
      - src/lib/native-auth-storage.ts
      - src/lib/native-platform.ts
      - src/routes/__root.tsx
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-security.yml
      - android/**
      - capacitor.config.ts
      - ios/**
      - mobile-shell/**
      - package.json
      - scripts/check-client-secrets.mjs
      - scripts/check-mobile-security.mjs
      - scripts/harden-native-projects.mjs
      - src/integrations/supabase/client.ts
      - src/lib/mobile-security.ts
      - src/lib/native-auth-storage.ts
      - src/lib/native-platform.ts
      - src/routes/__root.tsx

concurrency:
  group: mobile-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOBILE_APP_ORIGIN: https://check-your-name-ai.vercel.app
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PROJECT_ID: ci-placeholder
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  web-security:
    name: Web and client security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without creating a second lockfile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Scan client and mobile configuration
        run: npm run security:mobile-all

      - name: Build web application
        run: npm run build

  bootstrap-native-projects:
    name: Generate and compile native projects
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'feat/mobile-ios-android-foundation' &&
      !contains(github.event.head_commit.message, '[native-bootstrap]')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-ios-android-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies without creating a second lockfile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run client security checks
        run: npm run security:mobile-all

      - name: Build web application
        run: npm run build

      - name: Generate native projects when absent
        shell: bash
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Synchronize and harden native projects
        run: npm run mobile:sync

      - name: Verify hardened native files
        run: npm run security:mobile

      - name: Compile Android debug application
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Compile iOS simulator application without signing
        shell: bash
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Reject whitespace and merge artifacts
        run: git diff --check

      - name: Commit generated native projects
        shell: bash
        run: |
          git add android ios
          if git diff --cached --quiet; then
            echo 'Native projects are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: generate hardened native projects [native-bootstrap]'
          git push origin HEAD:feat/mobile-ios-android-foundation

  android-validation:
    name: Android validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Require generated Android project
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies without creating a second lockfile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Synchronize and harden Android
        run: npx cap sync android && npm run mobile:harden

      - name: Verify Android security
        run: npm run security:mobile

      - name: Ensure generated Android project is committed and current
        run: git diff --exit-code -- android

      - name: Compile Android debug application
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

  ios-validation:
    name: iOS validation
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Require generated iOS project
        run: test -f ios/App/App/Info.plist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without creating a second lockfile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Synchronize and harden iOS
        run: npx cap sync ios && npm run mobile:harden

      - name: Verify iOS security
        run: npm run security:mobile

      - name: Ensure generated iOS project is committed and current
        run: git diff --exit-code -- ios

      - name: Compile iOS simulator application without signing
        shell: bash
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
