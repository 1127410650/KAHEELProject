name: KAHEEL project authority guard

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaheel-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-project-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VITE_SUPABASE_URL: https://fdmovlxyqebtgzhsroac.supabase.co
      VITE_SUPABASE_PROJECT_ID: fdmovlxyqebtgzhsroac
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only_placeholder
      VITE_SITE_ORIGIN: https://check-your-name-ai.vercel.app
      MOBILE_APP_ORIGIN: https://check-your-name-ai.vercel.app

    steps:
      - name: Check out canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify repository, Supabase, deployment, and duplicate roots
        run: node scripts/check-project-authority.mjs --require-runtime

      - name: Prove a foreign repository is blocked
        shell: bash
        run: |
          set -euo pipefail
          if GITHUB_REPOSITORY=1127410650/unauthorized-copy node scripts/check-project-authority.mjs --require-runtime; then
            echo "Authority guard incorrectly accepted a foreign repository" >&2
            exit 1
          fi

      - name: Prove a foreign Supabase project is blocked
        shell: bash
        run: |
          set -euo pipefail
          if VITE_SUPABASE_URL=https://aaaaaaaaaaaaaaaaaaaa.supabase.co node scripts/check-project-authority.mjs --require-runtime; then
            echo "Authority guard incorrectly accepted a foreign Supabase project" >&2
            exit 1
          fi

      - name: Prove a duplicate Vercel project identity is blocked
        shell: bash
        run: |
          set -euo pipefail
          if env \
            -u GITHUB_REPOSITORY \
            -u GITHUB_REPOSITORY_ID \
            -u GITHUB_ACTIONS \
            CI=true \
            VERCEL=1 \
            VERCEL_GIT_REPO_OWNER=1127410650 \
            VERCEL_GIT_REPO_SLUG=unauthorized-copy \
            VERCEL_PROJECT_PRODUCTION_URL=unauthorized-copy.vercel.app \
            node scripts/check-project-authority.mjs --require-runtime; then
            echo "Authority guard incorrectly accepted a duplicate Vercel identity" >&2
            exit 1
          fi

      - name: Prove an unknown CI platform is blocked
        shell: bash
        run: |
          set -euo pipefail
          if env \
            -u GITHUB_REPOSITORY \
            -u GITHUB_REPOSITORY_ID \
            -u GITHUB_ACTIONS \
            -u VERCEL \
            CI=true \
            node scripts/check-project-authority.mjs --require-runtime; then
            echo "Authority guard incorrectly accepted an unknown CI platform" >&2
            exit 1
          fi
