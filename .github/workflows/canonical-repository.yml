name: KAHEEL project authority guard

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaheel-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-project-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VITE_SUPABASE_URL: https://fdmovlxyqebtgzhsroac.supabase.co
      VITE_SUPABASE_PROJECT_ID: fdmovlxyqebtgzhsroac
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only_placeholder
      VITE_SITE_ORIGIN: https://check-your-name-ai.vercel.app
      MOBILE_APP_ORIGIN: https://check-your-name-ai.vercel.app

    steps:
      - name: Check out canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify repository, Supabase, deployment, and duplicate roots
        run: node scripts/check-project-authority.mjs --require-runtime
