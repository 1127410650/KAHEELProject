name: Mobile foundation security

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/mobile-ios-android-*"
    paths:
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - mobile-shell/**
      - scripts/check-client-secrets.mjs
      - scripts/check-native-release-readiness.mjs
      - scripts/harden-native-projects.mjs
      - scripts/test-mobile-url-policy.mjs
      - scripts/test-native-auth-storage-policy.mjs
      - scripts/test-supabase-url-policy.mjs
      - src/lib/auth-storage.ts
      - src/lib/native-platform.ts
      - src/lib/native-auth-storage.ts
      - src/lib/mobile-security.ts
      - src/lib/mobile-url-policy.ts
      - src/lib/supabase-url-policy.ts
      - src/integrations/supabase/client.ts
      - src/routes/__root.tsx
      - vercel.json
      - .github/workflows/mobile-foundation.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - mobile-shell/**
      - scripts/check-client-secrets.mjs
      - scripts/check-native-release-readiness.mjs
      - scripts/harden-native-projects.mjs
      - scripts/test-mobile-url-policy.mjs
      - scripts/test-native-auth-storage-policy.mjs
      - scripts/test-supabase-url-policy.mjs
      - src/lib/auth-storage.ts
      - src/lib/native-platform.ts
      - src/lib/native-auth-storage.ts
      - src/lib/mobile-security.ts
      - src/lib/mobile-url-policy.ts
      - src/lib/supabase-url-policy.ts
      - src/integrations/supabase/client.ts
      - src/routes/__root.tsx
      - vercel.json
      - android/**
      - ios/**
      - .github/workflows/mobile-foundation.yml

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-foundation:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MOBILE_APP_ORIGIN: https://check-your-name-ai.vercel.app
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only_placeholder

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          check-latest: false

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Reject client secrets and unsafe mobile settings
        run: npm run security:client-secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build web application
        run: npm run build

      - name: Generate and harden native projects
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; fi
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync
          npm run mobile:harden
          npm run mobile:release:check
          npx cap doctor

      - name: Build Android debug application
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build iOS simulator application
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload validated native projects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-projects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            package-lock.json
            android
            !android/.gradle/**
            !android/local.properties
            ios
            !ios/App/Pods/**
            !ios/App/DerivedData/**

      - name: Upload Android debug package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
