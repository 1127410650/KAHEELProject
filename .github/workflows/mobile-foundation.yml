name: Mobile foundation security

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/mobile-ios-android-*"
    paths:
      - .kaheel/project-authority.json
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - mobile-shell/**
      - scripts/**
      - src/lib/**
      - src/integrations/supabase/client.ts
      - src/routes/__root.tsx
      - supabase/config.toml
      - vercel.json
      - .github/workflows/mobile-foundation.yml
  pull_request:
    branches:
      - main
    paths:
      - .kaheel/project-authority.json
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - mobile-shell/**
      - scripts/**
      - src/lib/**
      - src/integrations/supabase/client.ts
      - src/routes/__root.tsx
      - supabase/config.toml
      - vercel.json
      - android/**
      - ios/**
      - .github/workflows/mobile-foundation.yml

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-foundation:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MOBILE_APP_ORIGIN: https://check-your-name-ai.vercel.app
      MOBILE_RELEASE_BUILD: "0"
      VITE_SITE_ORIGIN: https://check-your-name-ai.vercel.app
      VITE_SUPABASE_URL: https://fdmovlxyqebtgzhsroac.supabase.co
      VITE_SUPABASE_PROJECT_ID: fdmovlxyqebtgzhsroac
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only_placeholder

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify canonical repository and Supabase authority
        run: node scripts/check-project-authority.mjs --require-runtime

      - name: Detect complete native foundation
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f capacitor.config.ts ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Capacitor foundation exists on this revision; native build is not applicable."
            exit 0
          fi

          for required in package-lock.json scripts/check-client-secrets.mjs scripts/harden-native-projects.mjs; do
            if [ ! -f "$required" ]; then
              echo "Partial native foundation detected: missing $required" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const pkg = require('./package.json');
          for (const name of ['security:client-secrets', 'mobile:harden', 'mobile:release:check']) {
            if (!pkg.scripts?.[name]) throw new Error(`Partial native foundation: missing npm script ${name}`);
          }
          NODE
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Report non-native revision
        if: steps.mobile.outputs.ready != 'true'
        run: echo "Authority checks passed; native build skipped because this revision has no Capacitor foundation."

      - name: Set up Java
        if: steps.mobile.outputs.ready == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          check-latest: false

      - name: Install locked dependencies without lifecycle scripts
        if: steps.mobile.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Reject client secrets and unsafe mobile settings
        if: steps.mobile.outputs.ready == 'true'
        run: npm run security:client-secrets

      - name: Audit production dependencies
        if: steps.mobile.outputs.ready == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Build web application
        if: steps.mobile.outputs.ready == 'true'
        run: npm run build

      - name: Generate and harden native projects
        if: steps.mobile.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; fi
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync
          npm run mobile:harden
          npm run mobile:release:check
          npx cap doctor

      - name: Build Android debug application
        if: steps.mobile.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build iOS simulator application
        if: steps.mobile.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Upload validated native projects
        if: steps.mobile.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-projects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            package-lock.json
            android
            !android/.gradle/**
            !android/local.properties
            ios
            !ios/App/Pods/**
            !ios/App/DerivedData/**

      - name: Upload Android debug package
        if: steps.mobile.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
