name: Mobile branch main sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-foundation.yml

permissions:
  contents: write

concurrency:
  group: mobile-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-latest-main:
    if: github.repository == '1127410650/check-your-name-ai' && github.head_ref == 'feat/mobile-ios-android-secure-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact mobile branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mobile-ios-android-secure-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main without changing reviewed mobile files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff origin/main
          git diff --check HEAD^1 HEAD
          git push origin HEAD:feat/mobile-ios-android-secure-foundation
