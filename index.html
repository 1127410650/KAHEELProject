  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}.shell{min-height:100dvh;padding-bottom:76px}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{min-height:66px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:42px;height:42px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 22px rgba(11,107,75,.24)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em}.nav{display:flex;gap:5px;margin-inline-start:24px}.nav button,.ghost,.outline,.primary,.danger{border:0;border-radius:12px;min-height:42px;padding:0 15px;font-weight:800}.nav button{background:transparent;color:var(--muted)}.nav button.active{background:var(--mint);color:var(--green)}.actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}.outline{border:1px solid var(--line);background:white;color:var(--ink)}.ghost{background:transparent;color:var(--green)}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green2)}.danger{background:#fff0ef;color:var(--red)}.small{min-height:34px!important;padding:0 11px!important;font-size:12px}.hero{padding:60px 0 42px;background:radial-gradient(circle at 50% 0,#d9f3e7 0,rgba(217,243,231,.25) 42%,transparent 72%);border-bottom:1px solid var(--line)}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--mint);color:var(--green);font-size:12px;font-weight:900}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.12;margin:18px 0 13px;max-width:780px}.hero p{max-width:700px;color:var(--muted);font-size:16px}.demo-banner{margin-top:20px;border:1px dashed #74b79d;background:#f4fff9;border-radius:16px;padding:13px 16px;color:#275f4d;font-size:13px}.searchbox{margin-top:26px;background:white;border:1px solid var(--line);padding:12px;border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 200px 150px auto;gap:9px}.field{width:100%;height:47px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 13px;color:var(--ink);outline:none}.field:focus{border-color:#53a789;box-shadow:0 0 0 3px rgba(19,129,94,.10)}textarea.field{height:auto;min-height:86px;padding-top:10px}.section{padding:34px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.section-title h2{margin:0;font-size:25px}.muted{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;color:var(--muted)}.chip.active{background:var(--green);border-color:var(--green);color:white}.near{border:1px solid var(--line);background:linear-gradient(135deg,#fff,#edf9f3);border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:24px}.near-icon{width:52px;height:52px;border-radius:18px;background:var(--green);color:white;display:grid;place-items:center;font-size:25px}.near .buttons{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 7px 24px rgba(23,81,64,.06);overflow:hidden}.cover{height:82px;background:linear-gradient(135deg,#d5f2e4,#f2faf6)}.pad{padding:17px}.provider-head{display:flex;align-items:flex-start;gap:11px}.avatar{width:48px;height:48px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;flex:0 0 auto}.provider-head h3{margin:0;font-size:17px}.provider-meta{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badge{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:var(--mint);color:var(--green)}.badge.amber{background:#fff5df;color:var(--amber)}.services{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.service{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf3f0}.service:last-child{border:0}.service strong{display:block;font-size:13px}.service small{color:var(--muted)}.service-actions{display:flex;gap:5px}.empty{padding:54px 18px;text-align:center;background:white;border:1px dashed var(--line);border-radius:22px}.empty b{display:block;font-size:20px;margin-bottom:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:17px}.stat b{display:block;font-size:29px;color:var(--green)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:18px}.panel h2,.panel h3{margin-top:0}.list{display:flex;flex-direction:column;gap:10px}.row{border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:center;gap:11px}.row-main{min-width:0;flex:1}.row-main b{display:block}.row-main small{color:var(--muted)}.status{padding:5px 9px;border-radius:999px;background:#fff5df;color:var(--amber);font-size:10px;font-weight:900}.status.ok{background:var(--mint);color:var(--green)}.status.bad{background:#fff0ef;color:var(--red)}.account-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-height:430px;overflow:auto}.account{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;text-align:start}.account.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(11,107,75,.10)}.account small{display:block;color:var(--muted)}.bottom{position:fixed;z-index:40;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(3,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;min-height:52px}.bottom button.active{color:var(--green)}.modal{position:fixed;inset:0;z-index:70;background:rgba(5,26,20,.62);display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:min(560px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:25px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.dialog-head{display:flex;align-items:flex-start;gap:12px}.dialog-head h2{margin:0}.close{margin-inline-start:auto;border:0;background:#eef5f2;border-radius:11px;width:38px;height:38px;font-size:22px}.form-grid{display:grid;gap:13px;margin-top:18px}.label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.otp{letter-spacing:.35em;text-align:center;font-size:24px;font-weight:900}.notice{background:var(--mint);color:#245e4b;border-radius:14px;padding:12px;font-size:12px}.toast{position:fixed;z-index:90;top:80px;left:50%;transform:translateX(-50%) translateY(-16px);opacity:0;pointer-events:none;background:#163c31;color:white;border-radius:13px;padding:11px 16px;transition:.22s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.table-scroll{overflow:auto}.accounts-table{width:100%;border-collapse:collapse;font-size:12px}.accounts-table th,.accounts-table td{text-align:start;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.footer{padding:30px 0 95px;color:var(--muted);text-align:center;font-size:12px}.ltr{direction:ltr;text-align:left}.desktop-only{display:block}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.searchbox{grid-template-columns:1fr 1fr}.searchbox .primary{grid-column:1/-1}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.nav{display:none}.bottom{display:grid}.shell{padding-bottom:72px}.near{align-items:flex-start;flex-wrap:wrap}.near .buttons{margin-inline-start:0;width:100%}.desktop-only{display:none}}
    @media(max-width:580px){.wrap{width:min(100% - 20px,1180px)}.topin{min-height:60px}.brand small{display:none}.mark{width:38px;height:38px}.actions .outline span{display:none}.hero{padding:38px 0 28px}.hero h1{font-size:36px}.hero p{font-size:14px}.searchbox{grid-template-columns:1fr}.searchbox .primary{grid-column:auto}.grid{grid-template-columns:1fr}.section{padding:26px 0}.section-title h2{font-size:21px}.service{grid-template-columns:1fr}.service-actions{justify-content:stretch}.service-actions button{flex:1}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:24px}.account-grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-wrap:wrap}.dialog{align-self:flex-end;border-radius:24px 24px 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom))}.modal{padding:0;align-items:flex-end}}
  </style>
</head>
<body>
  <div id="app"></div><div id="modal"></div><div id="toast" class="toast"></div>
  <script>
  (()=>{
    const MARKET='https://check-your-name-ai.vercel.app/';
    const OTP='123456';
    const STORE='kaheel-appointments-standalone-demo-v1';
    const categories=[
      ['medical_center','🏥','مراكز طبية','Medical centers'],['clinic','🩺','عيادات','Clinics'],['pharmacy','💊','صيدليات','Pharmacies'],['laboratory','🧪','مختبرات','Laboratories'],['dental','🦷','أسنان','Dental'],['radiology','🩻','أشعة','Radiology'],['physiotherapy','🏃','علاج طبيعي','Physiotherapy'],['home_care','🏠','رعاية منزلية','Home care'],['veterinary','🐾','بيطري','Veterinary'],['beauty_wellness','✨','عناية وجمال','Beauty & wellness'],['consulting','💼','استشارات','Consulting'],['other','📅','خدمات أخرى','Other services']
    ];
    const providerNames={
      medical_center:['مركز كَحيل الطبي — العليا','مجمع العافية الطبي — الروضة'],clinic:['عيادة النخبة التخصصية','عيادة درة الصحة'],pharmacy:['صيدلية بلسم','صيدلية العافية 24'],laboratory:['مختبر الدقة','مختبر نتائج'],dental:['مركز ابتسامة كَحيل','عيادات لؤلؤة الأسنان'],radiology:['مركز رؤية للأشعة','مركز الصورة التشخيصي'],physiotherapy:['مركز خطوة للعلاج الطبيعي','مركز توازن للتأهيل'],home_care:['رعاية بيتك','فريق عناية منزلية'],veterinary:['عيادة رفيق البيطرية','مركز أليف البيطري'],beauty_wellness:['مركز نضارة','صالون لمسة'],consulting:['مكتب بصيرة للاستشارات','مركز قرار'],other:['مركز خدمات كَحيل','استوديو موعد']
    };
    const serviceNames={
      medical_center:['كشف طب عام','استشارة باطنية'],clinic:['كشف أولي','موعد متابعة'],pharmacy:['استشارة صيدلي','تجهيز وصفة'],laboratory:['سحب عينة','مراجعة نتائج'],dental:['فحص أسنان','تنظيف أسنان'],radiology:['أشعة عامة','موجات فوق صوتية'],physiotherapy:['جلسة علاج طبيعي','تقييم حركة'],home_care:['زيارة تمريض','تقييم رعاية منزلية'],veterinary:['فحص بيطري','تطعيم حيوان أليف'],beauty_wellness:['استشارة عناية','جلسة تجميل'],consulting:['استشارة أعمال','جلسة تخطيط'],other:['موعد خدمة','استشارة عامة']
    };
    const cities=[['الرياض','العليا',24.7136,46.6753],['الرياض','الروضة',24.735,46.765],['جدة','الروضة',21.575,39.163],['الدمام','الشاطئ',26.446,50.102],['عمّان','الشميساني',31.963,35.91],['دمشق','المالكي',33.515,36.292]];
    const codePrefix={medical_center:'MED',clinic:'CLN',pharmacy:'PHA',laboratory:'LAB',dental:'DEN',radiology:'RAD',physiotherapy:'PHY',home_care:'HOM',veterinary:'VET',beauty_wellness:'BEA',consulting:'CON',other:'OTH'};
    const providers=[];
    categories.forEach((cat,ci)=>providerNames[cat[0]].forEach((name,i)=>{
      const c=cities[(ci+i)%cities.length]; const shift=(ci*2+i)*.0023;
      providers.push({id:`p-${cat[0]}-${i+1}`,code:`DEMO-${codePrefix[cat[0]]}-${String(i+1).padStart(2,'0')}`,category:cat[0],name,city:c[0],district:c[1],lat:c[2]+shift,lng:c[3]-shift,rating:(4.5+((ci+i)%5)/10).toFixed(1),services:serviceNames[cat[0]].map((s,si)=>({id:`s-${cat[0]}-${i+1}-${si+1}`,name:s,duration:si?45:30,price:cat[0]==='pharmacy'?0:50+ci*7+si*25,mode:(cat[0]==='pharmacy'||cat[0]==='laboratory')?(si?'appointment':'queue'):(si?'both':'appointment')}))});
    }));
    const customers=['أحمد السالم','نورة محمد','سارة علي','خالد يوسف','ريم الحربي','عمر حسن','ليان خالد','ياسر إبراهيم'];
    const tomorrow=(n=1)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    function seed(){
      const bookings=providers.slice(0,12).map((p,i)=>({id:`b-${i+1}`,providerId:p.id,serviceId:p.services[0].id,customer:customers[i%customers.length],phone:`+96650000${String(1100+i).padStart(4,'0')}`,date:tomorrow(i%4),time:`${String(9+(i%7)).padStart(2,'0')}:00`,status:i%3===0?'requested':'confirmed',created:Date.now()-i*50000}));
      const queues=providers.slice(12).map((p,i)=>({id:`q-${i+1}`,providerId:p.id,serviceId:p.services.find(s=>s.mode!=='appointment')?.id||p.services[0].id,customer:customers[(i+3)%customers.length],phone:`+96650000${String(2200+i).padStart(4,'0')}`,number:i%4+1,status:i%3===0?'called':'waiting',date:new Date().toISOString().slice(0,10),created:Date.now()-i*45000}));
      return {locale:'ar',view:'discover',session:null,bookings,queues,providerId:providers[0].id};
    }
    let state; try{state=JSON.parse(localStorage.getItem(STORE))||seed()}catch{state=seed()}
    let filters={q:'',category:'all',city:'',radius:20}; let userLocation=null; let selected=null; let pendingUser=null;
    const t=(ar,en)=>state.locale==='ar'?ar:en; const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const cat=id=>categories.find(c=>c[0]===id); const provider=id=>providers.find(p=>p.id===id); const service=(p,id)=>p?.services.find(s=>s.id===id);
    const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
    const toast=msg=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)};
    const dist=(a,b,c,d)=>{const R=6371,toRad=x=>x*Math.PI/180;const x=Math.sin(toRad(c-a)/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(toRad(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
    const money=n=>n?`${n} ر.س`:'مجاني';
    function setView(v){state.view=v;save();render();scrollTo({top:0,behavior:'smooth'})}
    function shell(content){
      document.documentElement.lang=state.locale;document.documentElement.dir=state.locale==='ar'?'rtl':'ltr';
      const nav=[['discover','⌕',t('استكشف','Discover')],['mine','◷',t('مواعيدي','My bookings')],['provider','▦',t('تقديم الخدمة','Provider')]];
      return `<div class="shell"><header class="top"><div class="wrap topin"><button class="brand" onclick="KA.view('discover')" style="border:0;background:none;text-align:start"><span class="mark">ك</span><span>${t('كَحيل مواعيد','KAHEEL Appointments')}<small>${t('KAHEEL Appointments','كَحيل مواعيد')}</small></span></button><nav class="nav">${nav.map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="KA.view('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}</nav><div class="actions"><button class="ghost small" onclick="KA.lang()">${state.locale==='ar'?'EN':'ع'}</button><a class="outline small" href="${MARKET}" target="_blank" rel="noopener"><span>${t('اذهب إلى سوق كَحيل','Go to KAHEEL Market')}</span> ↗</a></div></div></header>${content}<nav class="bottom">${nav.map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="KA.view('${n[0]}')"><b style="display:block;font-size:20px">${n[1]}</b>${n[2]}</button>`).join('')}</nav><footer class="footer wrap">${t('نسخة تجريبية مستقلة — جميع البيانات خيالية ولا تتصل بسوق كَحيل','Independent demo — all data is fictional and not connected to KAHEEL Market')}</footer></div>`;
    }
    function discover(){
      let rows=providers.filter(p=>(filters.category==='all'||p.category===filters.category)&&(!filters.city||p.city.includes(filters.city))&&(!filters.q||`${p.name} ${p.services.map(s=>s.name).join(' ')}`.includes(filters.q)));
      rows=rows.map(p=>({...p,distance:userLocation?dist(userLocation.lat,userLocation.lng,p.lat,p.lng):null})).filter(p=>p.distance==null||p.distance<=filters.radius).sort((a,b)=>(a.distance??9999)-(b.distance??9999));
      return shell(`<section class="hero"><div class="wrap"><span class="pill">✓ ${t('تطبيق مستقل وآمن','Independent and isolated')}</span><h1>${t('اعثر على الأقرب، واحجز دون تعقيد.','Find nearby services and book with ease.')}</h1><p>${t('مراكز طبية وصيدليات وعيادات ومختبرات وجميع فئات الخدمات في دليل واحد، مع موعد مسبق أو طابور مباشر.','Medical centers, pharmacies, clinics, laboratories and every service category in one directory, with scheduled bookings or a live queue.')}</p><div class="demo-banner"><b>${t('بيئة عرض مكتملة:','Complete demo environment:')}</b> 24 ${t('حساب مقدم خدمة،','provider accounts,')} 12 ${t('تصنيفًا،','categories,')} 48 ${t('خدمة، ورمز دخول العميل','services, customer OTP')} <span class="ltr" style="font-weight:900">123456</span>.</div><div class="searchbox"><input id="q" class="field" placeholder="${t('ابحث عن جهة أو خدمة','Search provider or service')}" value="${esc(filters.q)}"><input id="city" class="field" placeholder="${t('المدينة','City')}" value="${esc(filters.city)}"><select id="radius" class="field"><option value="10">10 كم</option><option value="20" ${filters.radius===20?'selected':''}>20 كم</option><option value="50" ${filters.radius===50?'selected':''}>50 كم</option><option value="100" ${filters.radius===100?'selected':''}>100 كم</option></select><button class="primary" onclick="KA.search()">⌕ ${t('بحث','Search')}</button></div></div></section><section class="section"><div class="wrap"><div class="chips"><button class="chip ${filters.category==='all'?'active':''}" onclick="KA.category('all')">${t('الكل','All')}</button>${categories.map(c=>`<button class="chip ${filters.category===c[0]?'active':''}" onclick="KA.category('${c[0]}')">${c[1]} ${state.locale==='ar'?c[2]:c[3]}</button>`).join('')}</div><div class="near"><div class="near-icon">⌖</div><div><b>${t('كَحيل دليل — أماكن قريبة منك','KAHEEL Directory — nearby places')}</b><div class="muted" style="font-size:13px">${userLocation?t(`الموقع نشط؛ نعرض النتائج ضمن ${filters.radius} كم. لا يتم حفظ موقعك.`,`Location is active; showing results within ${filters.radius} km. Your location is not stored.`):t('اسمح بالموقع أو استخدم موقع الرياض التجريبي لترتيب الجهات حسب المسافة. لا يتم حفظ موقع العميل.','Allow location or use the Riyadh demo location to sort providers by distance. Customer location is never stored.')}</div></div><div class="buttons"><button class="outline small" onclick="KA.locate()">⌖ ${t('استخدم موقعي','Use my location')}</button><button class="ghost small" onclick="KA.demoLocation()">${t('موقع الرياض التجريبي','Demo Riyadh location')}</button>${userLocation?`<button class="danger small" onclick="KA.clearLocation()">${t('إلغاء الموقع','Clear')}</button>`:''}</div></div><div class="section-title"><h2>${t('مقدمو الخدمة','Service providers')}</h2><span class="muted">${rows.length} / ${providers.length}</span></div>${rows.length?`<div class="grid">${rows.map(providerCard).join('')}</div>`:`<div class="empty"><b>${t('لا توجد نتائج ضمن هذا النطاق','No providers in this range')}</b><span class="muted">${t('وسّع المسافة أو ألغِ فلتر الموقع.','Increase the radius or clear location.')}</span></div>`}</div></section>`);
    }
    function providerCard(p){const c=cat(p.category);return `<article class="card"><div class="cover"></div><div class="pad"><div class="provider-head"><span class="avatar">${esc(p.name[0])}</span><div style="min-width:0;flex:1"><h3>${esc(p.name)}</h3><div class="provider-meta">⌖ ${esc(p.city)} · ${esc(p.district)}${p.distance!=null?` · <b>${p.distance.toFixed(1)} كم</b>`:''}</div></div></div><div class="badges"><span class="badge">${c[1]} ${state.locale==='ar'?c[2]:c[3]}</span><span class="badge amber">★ ${p.rating}</span><span class="badge">${t('متاح للحجز','Bookable')}</span></div><div class="services">${p.services.map(s=>`<div class="service"><div><strong>${esc(s.name)}</strong><small>${s.duration} ${t('دقيقة','min')} · ${money(s.price)}</small></div><div class="service-actions">${s.mode!=='queue'?`<button class="primary small" onclick="KA.open('${p.id}','${s.id}','appointment')">${t('احجز','Book')}</button>`:''}${s.mode!=='appointment'?`<button class="outline small" onclick="KA.open('${p.id}','${s.id}','queue')">${t('دور','Queue')}</button>`:''}</div></div>`).join('')}</div></div></article>`}
    function mine(){
      if(!state.session)return shell(`<section class="section"><div class="wrap"><div class="empty"><b>${t('دخول سريع دون كلمة مرور','Fast passwordless access')}</b><p class="muted">${t('اختر أي خدمة ثم أدخل الاسم والجوال ورمز العرض 123456.','Choose a service, then enter your name, mobile and demo code 123456.')}</p><button class="primary" onclick="KA.view('discover')">${t('ابدأ الحجز','Start booking')}</button></div></div></section>`);
      const mineB=state.bookings.filter(b=>b.phone===state.session.phone),mineQ=state.queues.filter(q=>q.phone===state.session.phone&&['waiting','called','serving'].includes(q.status));
      return shell(`<section class="section"><div class="wrap"><div class="section-title"><div><span class="pill">✓ ${t('جوال موثق تجريبيًا','Demo verified mobile')}</span><h2 style="margin-top:10px">${t('مرحبًا','Hello')}، ${esc(state.session.name)}</h2><div class="muted ltr">${esc(state.session.phone)}</div></div><button class="danger small" onclick="KA.logout()">${t('تسجيل الخروج','Sign out')}</button></div>${mineQ.length?`<h3>${t('الطابور النشط','Active queue')}</h3><div class="grid">${mineQ.map(q=>{const p=provider(q.providerId),s=service(p,q.serviceId),ahead=Math.max(0,q.number-1);return `<div class="panel"><span class="status ${q.status!=='waiting'?'ok':''}">${statusText(q.status)}</span><h3>${esc(p.name)}</h3><p>${esc(s.name)}</p><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b>${q.number}</b><small>${t('رقمك','Number')}</small></div><div class="stat"><b>${ahead}</b><small>${t('أمامك','Ahead')}</small></div><div class="stat"><b>${ahead*s.duration}</b><small>${t('دقيقة','Minutes')}</small></div></div><button class="danger small" style="margin-top:12px" onclick="KA.cancelQueue('${q.id}')">${t('إلغاء الدور','Cancel queue')}</button></div>`}).join('')}</div>`:''}<div class="section-title" style="margin-top:28px"><h2>${t('مواعيدي','My appointments')}</h2><button class="primary small" onclick="KA.view('discover')">+ ${t('موعد جديد','New booking')}</button></div>${mineB.length?`<div class="list">${mineB.sort((a,b)=>`${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`)).map(b=>bookingRow(b,true)).join('')}</div>`:`<div class="empty"><b>${t('لا توجد مواعيد لهذا الرقم','No appointments for this number')}</b></div>`}</div></section>`);
    }
    function providerView(){
      const p=provider(state.providerId)||providers[0];state.providerId=p.id;const bs=state.bookings.filter(b=>b.providerId===p.id),qs=state.queues.filter(q=>q.providerId===p.id&&['waiting','called','serving'].includes(q.status));
      const pending=bs.filter(b=>b.status==='requested').length,done=bs.filter(b=>b.status==='completed').length;
      return shell(`<section class="section"><div class="wrap"><div class="section-title"><div><span class="pill">${t('وضع مقدم الخدمة التجريبي','Demo provider mode')}</span><h2 style="margin-top:9px">${esc(p.name)}</h2><div class="muted">${esc(p.code)} · ${cat(p.category)[2]}</div></div><button class="outline small" onclick="KA.reset()">↺ ${t('إعادة بيانات العرض','Reset demo')}</button></div><div class="stats"><div class="stat"><b>${bs.length}</b><span>${t('المواعيد','Appointments')}</span></div><div class="stat"><b>${pending}</b><span>${t('بانتظار التأكيد','Pending')}</span></div><div class="stat"><b>${qs.length}</b><span>${t('الطابور النشط','Active queue')}</span></div><div class="stat"><b>${done}</b><span>${t('مكتملة','Completed')}</span></div></div><div class="layout" style="margin-top:18px"><div><div class="panel"><h3>${t('مواعيد الحساب','Provider appointments')}</h3>${bs.length?`<div class="list">${bs.map(b=>bookingRow(b,false)).join('')}</div>`:`<p class="muted">${t('لا توجد مواعيد. أنشئ حجزًا من واجهة العميل لهذا الحساب.','No bookings. Create one from the customer view.')}</p>`}</div><div class="panel" style="margin-top:16px"><h3>${t('قائمة الانتظار','Live queue')}</h3>${qs.length?`<div class="list">${qs.sort((a,b)=>a.number-b.number).map(queueRow).join('')}</div>`:`<p class="muted">${t('القائمة فارغة.','Queue is empty.')}</p>`}</div></div><aside class="panel"><h3>${t('الحسابات التجريبية','Demo provider accounts')}</h3><p class="muted" style="font-size:12px">${t('24 حسابًا خياليًا — حسابان لكل تصنيف. التبديل فوري ولا يتطلب كلمة مرور في بيئة العرض.','24 fictional accounts — two per category. Instant switching in demo mode.')}</p><div class="account-grid">${providers.map(x=>`<button class="account ${x.id===p.id?'active':''}" onclick="KA.provider('${x.id}')"><b>${esc(x.name)}</b><small>${esc(x.code)} · ${cat(x.category)[2]}</small></button>`).join('')}</div></aside></div><div class="panel table-scroll" style="margin-top:18px"><h3>${t('جرد الحسابات والتصنيفات','Account and category inventory')}</h3><table class="accounts-table"><thead><tr><th>#</th><th>${t('رمز الحساب','Account code')}</th><th>${t('التصنيف','Category')}</th><th>${t('الجهة','Provider')}</th><th>${t('الخدمات','Services')}</th></tr></thead><tbody>${providers.map((x,i)=>`<tr><td>${i+1}</td><td class="ltr">${x.code}</td><td>${cat(x.category)[1]} ${cat(x.category)[2]}</td><td>${esc(x.name)}</td><td>${x.services.length}</td></tr>`).join('')}</tbody></table></div></div></section>`);
    }
    function bookingRow(b,customerSide){const p=provider(b.providerId),s=service(p,b.serviceId);let actions='';if(customerSide&&['requested','confirmed'].includes(b.status))actions=`<button class="danger small" onclick="KA.cancelBooking('${b.id}')">${t('إلغاء','Cancel')}</button>`;if(!customerSide){if(b.status==='requested')actions=`<button class="primary small" onclick="KA.bookingStatus('${b.id}','confirmed')">${t('تأكيد','Confirm')}</button>`;else if(b.status==='confirmed')actions=`<button class="primary small" onclick="KA.bookingStatus('${b.id}','in_service')">${t('بدء','Start')}</button>`;else if(b.status==='in_service')actions=`<button class="primary small" onclick="KA.bookingStatus('${b.id}','completed')">${t('إنهاء','Complete')}</button>`}return `<div class="row"><div class="row-main"><b>${esc(s?.name||'خدمة')} — ${esc(customerSide?p.name:b.customer)}</b><small>${esc(b.date)} · ${esc(b.time)}${customerSide?'':` · ${esc(b.phone)}`}</small></div><span class="status ${['confirmed','completed'].includes(b.status)?'ok':b.status.includes('cancel')?'bad':''}">${statusText(b.status)}</span>${actions}</div>`}
    function queueRow(q){const p=provider(q.providerId),s=service(p,q.serviceId);const next=q.status==='waiting'?'called':q.status==='called'?'serving':q.status==='serving'?'done':null;return `<div class="row"><span class="avatar" style="width:40px;height:40px">${q.number}</span><div class="row-main"><b>${esc(q.customer)}</b><small>${esc(s?.name||'خدمة')} · ${esc(q.phone)}</small></div><span class="status ${q.status!=='waiting'?'ok':''}">${statusText(q.status)}</span>${next?`<button class="primary small" onclick="KA.queueStatus('${q.id}','${next}')">${next==='called'?t('نداء','Call'):next==='serving'?t('بدء','Start'):t('إنهاء','Complete')}</button>`:''}</div>`}
    function statusText(s){const m={requested:t('بانتظار التأكيد','Pending'),confirmed:t('مؤكد','Confirmed'),in_service:t('جاري الخدمة','In service'),completed:t('مكتمل','Completed'),cancelled_by_customer:t('ألغاه العميل','Customer cancelled'),waiting:t('في الانتظار','Waiting'),called:t('تم النداء','Called'),serving:t('جاري الخدمة','Serving'),done:t('مكتمل','Done'),cancelled:t('ملغي','Cancelled')};return m[s]||s}
    function render(){document.getElementById('app').innerHTML=state.view==='discover'?discover():state.view==='mine'?mine():providerView()}
    function open(providerId,serviceId,mode){selected={providerId,serviceId,mode};renderModal()}
    function renderModal(){if(!selected){document.getElementById('modal').innerHTML='';return}const p=provider(selected.providerId),s=service(p,selected.serviceId);let body;if(!state.session){body=`<div class="notice">${t('دخول العميل بسيط: الاسم الكامل + الجوال + رمز تحقق فقط. لا توجد كلمة مرور. رمز العرض هو 123456.','Simple customer access: full name + mobile + OTP only. No password. Demo code is 123456.')}</div><div class="form-grid"><label><span class="label">${t('الاسم الكامل','Full name')}</span><input id="loginName" class="field" autocomplete="name"></label><label><span class="label">${t('رقم الجوال','Mobile')}</span><input id="loginPhone" class="field ltr" inputmode="tel" placeholder="+9665XXXXXXXX"></label>${pendingUser?`<label><span class="label">${t('رمز التحقق','Verification code')}</span><input id="otp" class="field otp" inputmode="numeric" value="123456"></label><button class="primary" onclick="KA.verify()">${t('تحقق ومتابعة','Verify and continue')}</button>`:`<button class="primary" onclick="KA.sendOtp()">${t('إرسال رمز التحقق','Send verification code')}</button>`}</div>`}else if(selected.mode==='appointment'){body=`<div class="notice">✓ ${esc(state.session.name)} · <span class="ltr">${esc(state.session.phone)}</span></div><div class="form-grid"><label><span class="label">${t('التاريخ','Date')}</span><input id="bookDate" class="field" type="date" min="${tomorrow(0)}" value="${tomorrow(1)}"></label><label><span class="label">${t('الوقت','Time')}</span><select id="bookTime" class="field">${['09:00','10:00','11:00','12:00','14:00','16:00','18:00'].map(x=>`<option>${x}</option>`).join('')}</select></label><label><span class="label">${t('ملاحظات اختيارية','Optional notes')}</span><textarea id="notes" class="field"></textarea></label><button class="primary" onclick="KA.confirmBooking()">${t('تأكيد الحجز','Confirm booking')}</button></div>`}else{body=`<div class="notice">✓ ${esc(state.session.name)} · <span class="ltr">${esc(state.session.phone)}</span></div><p>${t('سيُنشأ رقم دور اليوم ويظهر فورًا في مواعيدي.','A queue number for today will appear immediately under My bookings.')}</p><button class="primary" style="width:100%" onclick="KA.confirmQueue()">${t('دخول قائمة الانتظار','Join live queue')}</button>`}document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)KA.close()"><div class="dialog"><div class="dialog-head"><div><span class="pill">${selected.mode==='appointment'?t('موعد مسبق','Scheduled booking'):t('انتظار مباشر','Live queue')}</span><h2>${esc(s.name)}</h2><div class="muted">${esc(p.name)} · ${s.duration} ${t('دقيقة','min')} · ${money(s.price)}</div></div><button class="close" onclick="KA.close()">×</button></div>${body}</div></div>`}
    const KA=window.KA={view:setView,lang(){state.locale=state.locale==='ar'?'en':'ar';save();render();renderModal()},search(){filters.q=document.getElementById('q').value.trim();filters.city=document.getElementById('city').value.trim();filters.radius=+document.getElementById('radius').value;render()},category(id){filters.category=id;render()},locate(){if(!navigator.geolocation)return toast(t('المتصفح لا يدعم الموقع','Location is unsupported'));navigator.geolocation.getCurrentPosition(x=>{userLocation={lat:x.coords.latitude,lng:x.coords.longitude};render();toast(t('تم ترتيب النتائج حسب موقعك دون حفظه','Results sorted by location without storing it'))},()=>toast(t('تعذر الوصول للموقع. استخدم موقع الرياض التجريبي.','Location unavailable; use the demo location.')),{enableHighAccuracy:true,timeout:12000,maximumAge:0})},demoLocation(){userLocation={lat:24.7136,lng:46.6753};render();toast(t('تم تفعيل موقع الرياض التجريبي','Demo Riyadh location activated'))},clearLocation(){userLocation=null;render()},open,close(){selected=null;pendingUser=null;renderModal()},sendOtp(){const name=document.getElementById('loginName').value.trim(),phone=document.getElementById('loginPhone').value.trim().replace(/\s/g,'');if(name.length<2||phone.length<8)return toast(t('أدخل الاسم والجوال بشكل صحيح','Enter a valid name and mobile'));pendingUser={name,phone};renderModal();toast(t('رمز العرض: 123456','Demo code: 123456'))},verify(){const code=document.getElementById('otp').value.trim();if(code!==OTP)return toast(t('الرمز غير صحيح','Incorrect code'));state.session={...pendingUser,verified:true};save();pendingUser=null;render();renderModal();toast(t('تم التحقق بنجاح','Verified successfully'))},confirmBooking(){const p=provider(selected.providerId),date=document.getElementById('bookDate').value,time=document.getElementById('bookTime').value,exists=state.bookings.some(b=>b.providerId===p.id&&b.date===date&&b.time===time&&!b.status.includes('cancel'));if(exists)return toast(t('هذا الوقت محجوز؛ اختر وقتًا آخر','This time is already booked'));state.bookings.push({id:`b-${Date.now()}`,providerId:p.id,serviceId:selected.serviceId,customer:state.session.name,phone:state.session.phone,date,time,status:'requested',created:Date.now()});save();KA.close();state.view='mine';save();render();toast(t('تم إنشاء الموعد','Appointment created'))},confirmQueue(){const today=new Date().toISOString().slice(0,10),active=state.queues.find(q=>q.providerId===selected.providerId&&q.phone===state.session.phone&&q.date===today&&['waiting','called','serving'].includes(q.status));if(active)return toast(t(`لديك دور نشط رقم ${active.number}`,`You already have active queue #${active.number}`));const nums=state.queues.filter(q=>q.providerId===selected.providerId&&q.date===today).map(q=>q.number);const number=Math.max(0,...nums)+1;state.queues.push({id:`q-${Date.now()}`,providerId:selected.providerId,serviceId:selected.serviceId,customer:state.session.name,phone:state.session.phone,number,status:'waiting',date:today,created:Date.now()});save();KA.close();state.view='mine';save();render();toast(t(`رقم دورك ${number}`,`Your queue number is ${number}`))},logout(){state.session=null;save();render()},cancelBooking(id){const b=state.bookings.find(x=>x.id===id);if(b)b.status='cancelled_by_customer';save();render();toast(t('تم إلغاء الموعد','Booking cancelled'))},cancelQueue(id){const q=state.queues.find(x=>x.id===id);if(q)q.status='cancelled';save();render();toast(t('تم إلغاء الدور','Queue cancelled'))},provider(id){state.providerId=id;save();render()},bookingStatus(id,s){const b=state.bookings.find(x=>x.id===id);if(b)b.status=s;save();render();toast(t('تم تحديث الموعد','Booking updated'))},queueStatus(id,s){const q=state.queues.find(x=>x.id===id);if(q)q.status=s;save();render();toast(t('تم تحديث الطابور','Queue updated'))},reset(){if(!confirm(t('إعادة جميع بيانات العرض؟','Reset all demo data?')))return;state=seed();save();filters={q:'',category:'all',city:'',radius:20};userLocation=null;render();toast(t('أعيدت بيانات العرض','Demo data reset'))}};
    render();
  })();
  </script>
