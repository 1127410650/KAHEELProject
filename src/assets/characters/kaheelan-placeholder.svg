<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 600" width="340" height="600" role="img">
  <!--
    شكل مؤقت لـ«الزعيم كَحيلان» — طاقية سوداء، شارب كثيف مفتول، صدرية مطرّزة
    حمراء، كوفية على الكتفين، سروال أسود فضفاض، عصاية مرفوعة ويد على الخصر.
    يُستبدل لاحقًا بالرسم النهائي: انظر src/lib/mascot-assets.ts
  -->
  <g fill="none" stroke="#2b0a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- عصاية مرفوعة -->
    <path d="M268 128l-26 250" stroke="#7a5326" stroke-width="12"/>
    <path d="M268 128c16-6 22-24 8-32" stroke="#7a5326" stroke-width="12"/>
    <!-- سروال أسود فضفاض واسع -->
    <path d="M96 372c-22 66-32 122-34 170h52l16-112 16 112h52c-2-48-12-104-34-170z" fill="#150d1e"/>
    <path d="M66 542h52v18H66zM186 542h52v18h-52z" fill="#3a2a1a"/>
    <!-- جسم -->
    <path d="M92 208c0-32 26-50 60-50s60 18 60 50v170H92z" fill="#f3ede1"/>
    <!-- صدرية مطرّزة حمراء -->
    <path d="M100 214c-8 30-10 78-4 138 4 18 6 24 8 26h-14V214zM204 214c8 30 10 78 4 138-4 18-6 24-8 26h14V214z" fill="#8c1220"/>
    <path d="M108 240h10M108 272h10M108 304h10M188 240h10M188 272h10M188 304h10" stroke="#e6c04a" stroke-width="6"/>
    <!-- كوفية على الكتفين -->
    <path d="M96 210c-14 26-16 58-10 86 16-14 24-46 24-78zM212 210c14 26 16 58 10 86-16-14-24-46-24-78z" fill="#e8e2d4"/>
    <!-- يد على الخصر -->
    <path d="M92 238c-24 8-32 34-24 60"/>
    <circle cx="74" cy="312" r="16" fill="#e8b183"/>
    <!-- اليد الرافعة للعصاية -->
    <path d="M212 236c18-22 34-56 44-84"/>
    <circle cx="250" cy="160" r="17" fill="#e8b183"/>
    <!-- رأس -->
    <circle cx="152" cy="112" r="54" fill="#eec096"/>
    <!-- طاقية سوداء -->
    <path d="M100 92c4-34 26-52 52-52s48 18 52 52z" fill="#15101c"/>
    <!-- عينان ماكرتان -->
    <path d="M126 104c8-6 16-6 22 0M156 104c8-6 16-6 22 0" stroke-width="6"/>
    <!-- شارب كثيف مفتول -->
    <path d="M116 132c14-10 24-10 36-4 12-6 22-6 36 4-6 16-24 20-36 12-12 8-30 4-36-12z" fill="#241205"/>
    <path d="M116 132c-14-6-20-18-14-28M188 132c14-6 20-18 14-28" stroke="#241205" stroke-width="8"/>
    <!-- ابتسامة ماكرة لطيفة -->
    <path d="M138 152c10 8 22 6 30-2" stroke-width="5"/>
  </g>
</svg>
