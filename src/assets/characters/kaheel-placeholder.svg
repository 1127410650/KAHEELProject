<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" role="img">
  <!--
    شكل مؤقت لـ«كَحيل» — شاب أنيق، لحية قصيرة، قميص أبيض وصدرية مطرّزة
    ذهبية/حمراء، سروال أسود فضفاض، يمدّ يده مرحّبًا.
    يُستبدل لاحقًا بالرسم النهائي: انظر src/lib/mascot-assets.ts
  -->
  <g fill="none" stroke="#2b0a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- سروال أسود فضفاض -->
    <path d="M112 372c-14 62-22 118-24 170h44l16-118 16 118h44c-2-52-10-108-24-170z" fill="#1b1024"/>
    <!-- جزمة -->
    <path d="M84 542h48v18H84zM168 542h48v18h-48z" fill="#3a2a1a"/>
    <!-- قميص أبيض -->
    <path d="M104 196c0-28 20-44 46-44s46 16 46 44v182h-92z" fill="#fdfdfd"/>
    <!-- صدرية مطرّزة -->
    <path d="M112 200c-8 24-10 66-6 118 4 34 8 50 12 58h-14V200zM188 200c8 24 10 66 6 118-4 34-8 50-12 58h14V200z" fill="#7a1024"/>
    <path d="M118 226h8M118 254h8M118 282h8M174 226h8M174 254h8M174 282h8" stroke="#e2b53f" stroke-width="6"/>
    <!-- يد ممدودة للترحيب -->
    <path d="M196 224c22 6 40-6 54-26" />
    <circle cx="256" cy="190" r="16" fill="#f0c39a"/>
    <!-- يد ثانية -->
    <path d="M104 226c-16 10-26 30-28 52"/>
    <circle cx="72" cy="292" r="15" fill="#f0c39a"/>
    <!-- رأس -->
    <circle cx="150" cy="112" r="52" fill="#f5cba6"/>
    <!-- شعر -->
    <path d="M100 100c6-34 30-50 50-50s44 16 50 50c-14-14-30-20-50-20s-36 6-50 20z" fill="#241407"/>
