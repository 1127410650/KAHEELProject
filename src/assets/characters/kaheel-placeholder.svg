    <circle cx="132" cy="108" r="5" fill="#22110a" stroke="none"/>
    <circle cx="168" cy="108" r="5" fill="#22110a" stroke="none"/>
    <path d="M134 134c10 8 22 8 32 0" stroke-width="5"/>
  </g>
</svg>
