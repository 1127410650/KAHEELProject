<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071B33" />
    <title>كحلي</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at top, #123a68 0%, #071b33 48%, #04101f 100%);
        color: #fff;
      }
      main { width: min(100%, 420px); text-align: center; }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 26px;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.18);
        font-size: 28px;
        font-weight: 800;
        box-shadow: 0 24px 60px rgba(0,0,0,.3);
      }
      h1 { margin: 0; font-size: 30px; }
      p { margin: 12px 0 24px; color: rgba(255,255,255,.72); line-height: 1.8; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        padding: 0 22px;
        background: #fff;
        color: #071b33;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">كحلي</div>
      <h1>تعذر الاتصال بالمنصة</h1>
      <p>تحقق من اتصال الإنترنت ثم حاول فتح كحلي مرة أخرى.</p>
      <a href="https://check-your-name-ai.vercel.app">إعادة المحاولة</a>
    </main>
  </body>
</html>
