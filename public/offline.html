<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071B33" />
    <title>كحلي — غير متصل</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at top, #143e70, #071b33 48%, #04101f);
        color: #fff;
      }
      main { max-width: 420px; text-align: center; }
      img { width: 84px; height: 84px; border-radius: 24px; box-shadow: 0 20px 55px rgba(0,0,0,.35); }
      h1 { margin: 22px 0 8px; font-size: 26px; }
      p { margin: 0; color: rgba(255,255,255,.72); line-height: 1.8; }
      button {
        margin-top: 24px;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        padding: 0 22px;
        background: #fff;
        color: #071b33;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="كحلي" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>بعض المحتوى يحتاج اتصالًا مباشرًا. أعد المحاولة بعد عودة الشبكة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
