<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">علم سوريا بخلفية فنية</title>
  <desc id="desc">خلفية هادئة مستوحاة من العلم السوري الأخضر والأبيض والأسود بثلاث نجمات حمراء</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071b18"/>
      <stop offset="0.48" stop-color="#123b31"/>
      <stop offset="1" stop-color="#d8a55d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#005b3d"/>
      <stop offset="0.5" stop-color="#0f8a59"/>
      <stop offset="1" stop-color="#05613f"/>
    </linearGradient>
    <linearGradient id="white" x1="0" x2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7dfd2"/>
    </linearGradient>
    <linearGradient id="black" x1="0" x2="1">
      <stop offset="0" stop-color="#0e1515"/>
      <stop offset="0.55" stop-color="#202625"/>
      <stop offset="1" stop-color="#080d0d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="flagClip">
      <path d="M180 150 C470 65 810 215 1390 105 L1390 530 C870 645 480 505 180 600 Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1320" cy="125" r="165" fill="#ffd894" opacity=".42" filter="url(#soft)"/>
  <circle cx="290" cy="650" r="260" fill="#001c15" opacity=".58" filter="url(#soft)"/>
  <g opacity=".22" fill="#fff">
    <ellipse cx="1220" cy="115" rx="270" ry="64" filter="url(#soft)"/>
    <ellipse cx="450" cy="95" rx="240" ry="54" filter="url(#soft)"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M180 150 C470 65 810 215 1390 105 L1390 530 C870 645 480 505 180 600 Z" fill="#fff"/>
    <g clip-path="url(#flagClip)">
      <path d="M120 90 H1460 V290 C920 410 500 260 120 355 Z" fill="url(#green)"/>
      <path d="M120 278 C510 190 940 390 1460 255 V470 C910 580 500 425 120 510 Z" fill="url(#white)"/>
      <path d="M120 500 C520 405 920 620 1460 455 V690 H120 Z" fill="url(#black)"/>
      <path d="M120 278 C510 190 940 390 1460 255" fill="none" stroke="#fff" stroke-opacity=".17" stroke-width="8"/>
      <path d="M120 500 C520 405 920 620 1460 455" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="8"/>
      <g fill="#d61f2c" transform="translate(0 24)">
        <path d="M566 304 l15 31 34 5-25 24 6 34-30-16-30 16 6-34-25-24 34-5z"/>
        <path d="M806 331 l15 31 34 5-25 24 6 34-30-16-30 16 6-34-25-24 34-5z"/>
        <path d="M1046 323 l15 31 34 5-25 24 6 34-30-16-30 16 6-34-25-24 34-5z"/>
      </g>
      <path d="M160 130 C530 50 950 245 1440 90" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="18"/>
    </g>
  </g>
  <rect width="1600" height="700" fill="url(#sky)" opacity=".14"/>
</svg>
